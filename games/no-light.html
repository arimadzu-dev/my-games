<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Без света</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Russo+One&display=swap">
<style>
/* Layout: one vertical 9:16 "phone video" stage centered on a night-blue ground; captions TikTok-style inside it. */
:root {
  --night: #070b14;
  --ink: #0d1424;
  --panel: #141d31;
  --line: #24314d;
  --text: #f3f4f8;
  --muted: #8d97b0;
  --hl: #ffd21f;
  --danger: #ef5a5f;
  --ok: #5fd39a;
  --font-display: "Russo One", "Arial Black", Impact, sans-serif;
  --font-body: "Rubik", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #10192c 0%, var(--night) 60%);
  background-color: var(--night);
  color: var(--text);
  font-family: var(--font-body);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.top { width: var(--stage-w); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 18px; letter-spacing: .5px; }
.brand span { color: var(--hl); }
.found { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.top-right { display: flex; align-items: center; gap: 12px; }
.voice-btn { appearance: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  background: var(--panel); color: var(--text); font: 500 13px var(--font-body); display: inline-flex; align-items: center; gap: 6px; }
.voice-btn[aria-pressed="true"] { border-color: var(--hl); color: var(--hl); }
.voice-btn:disabled { cursor: not-allowed; color: var(--muted); }
.voice-btn:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.voice-btn svg { width: 14px; height: 14px; }
:root { --stage-w: min(100%, calc((100dvh - 120px) * 9 / 16), 430px); }

.stage {
  position: relative; width: var(--stage-w); max-width: 100%; aspect-ratio: 9 / 16;
  border-radius: 22px; overflow: hidden; background: var(--ink);
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px var(--line);
  container-type: inline-size; cursor: pointer; user-select: none;
}
.art { position: absolute; inset: 0; }
.art svg { width: 100%; height: 100%; display: block; }
.art.enter { animation: fadein .6s ease-out; }
@keyframes fadein { from { opacity: .15; transform: scale(1.04); } to { opacity: 1; transform: none; } }

.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
  padding: 4cqw 4.5cqw; background: linear-gradient(rgba(5,8,15,.75), transparent); pointer-events: none; }
.day { font-family: var(--font-display); font-size: 4.2cqw; letter-spacing: .5px; }
.day small { display: block; font-family: var(--font-body); font-size: 3cqw; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.stats { display: grid; gap: 1.2cqw; justify-items: end; }
.stat { display: flex; align-items: center; gap: 1.6cqw; font-size: 2.8cqw; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.pips { display: flex; gap: .8cqw; }
.pip { width: 3.2cqw; height: 1.6cqw; border-radius: 1cqw; background: rgba(255,255,255,.14); transition: background .3s; }
.pip.on { background: var(--text); }
.stat.low .pip.on { background: var(--danger); }
.stat.bump { animation: bump .5s; }
@keyframes bump { 50% { transform: scale(1.18); } }

.caption { position: absolute; left: 5cqw; right: 5cqw; top: 66%; transform: translateY(-50%); text-align: center;
  font-family: var(--font-body); font-weight: 900; font-size: 7.4cqw; line-height: 1.12; text-wrap: balance;
  color: #fff; paint-order: stroke fill; -webkit-text-stroke: 1.6cqw rgba(0,0,0,.9); pointer-events: none; min-height: 1em; }
.caption .hl { color: var(--hl); }
.caption .chunk { display: inline-block; animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

.choices { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 2.4cqw; padding: 4.5cqw;
  background: linear-gradient(transparent, rgba(5,8,15,.92) 30%); }
.choice { appearance: none; border: 0; border-radius: 3.4cqw; padding: 3.6cqw 4cqw; text-align: left; cursor: pointer;
  font: 700 4.2cqw/1.25 var(--font-body); color: #11141c; background: var(--text);
  box-shadow: 0 1cqw 0 rgba(0,0,0,.35); transition: transform .12s, background .12s; }
.choice:hover { background: var(--hl); }
.choice:active { transform: translateY(.6cqw); box-shadow: 0 .4cqw 0 rgba(0,0,0,.35); }
.choice:focus-visible { outline: 3px solid var(--hl); outline-offset: 3px; }
.choice .fx { display: block; font-weight: 500; font-size: 3.1cqw; color: #4a5168; margin-top: .6cqw; }

.tap { position: absolute; bottom: 4.5cqw; left: 0; right: 0; text-align: center; font-size: 3cqw; letter-spacing: 1.5px;
  text-transform: uppercase; color: rgba(255,255,255,.55); pointer-events: none; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .3; } }

.title-card { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 5cqw;
  padding: 8cqw; text-align: center; background: rgba(5,8,15,.55); }
.title-card h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 9.6cqw; line-height: 1.08; text-wrap: balance;
  paint-order: stroke fill; -webkit-text-stroke: 1.2cqw rgba(0,0,0,.85); }
.title-card h1 em { font-style: normal; color: var(--hl); }
.title-card p { margin: 0; color: #c9cfdf; font-size: 3.8cqw; line-height: 1.4; max-width: 34ch; }
.cta { appearance: none; border: 0; border-radius: 999px; padding: 3.8cqw 9cqw; cursor: pointer;
  font: 900 4.6cqw var(--font-body); letter-spacing: .5px; color: #11141c; background: var(--hl);
  box-shadow: 0 0 0 0 rgba(255,210,31,.5); animation: pulse 2s infinite; }
.cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
@keyframes pulse { 70% { box-shadow: 0 0 0 4cqw rgba(255,210,31,0); } }
.ending-tag { font-size: 3cqw; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.ending-tag b { color: var(--hl); font-weight: 700; }
.tone-good b { color: var(--ok); } .tone-bad b { color: var(--danger); }

.foot { width: var(--stage-w); max-width: 100%; color: var(--muted); font-size: 12.5px; line-height: 1.45; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="top">
  <div class="brand">БЕЗ <span>СВЕТА</span></div>
  <div class="top-right">
    <button class="voice-btn" id="voice-btn" type="button" aria-pressed="true">Озвучка</button>
    <div class="found" id="found"></div>
  </div>
</div>
<div class="stage" id="stage" role="region" aria-label="Интерактивная история">
  <div class="art" id="art"></div>
  <div class="hud" id="hud" hidden></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="tap" id="tap" hidden>нажми, чтобы пропустить</div>
  <div class="choices" id="choices" hidden></div>
  <div class="title-card" id="card"></div>
</div>
<div class="foot">Интерактивная история на выживание. Нажимай на экран, чтобы пропускать субтитры, и выбирай, что делать дальше.</div>

<script>
"use strict";

  const blocks = [[0,300,60,340],[55,250,50,390],[100,320,45,320],[140,210,70,430],[205,280,50,360],[250,240,60,400],[305,300,60,340]];
  return blocks.map(([x, y, w, h]) => {
    let wins = "";
    for (let wy = y + 16; wy < 600; wy += 26) for (let wx = x + 8; wx < x + w - 10; wx += 16)
      wins += `<rect x="${wx}" y="${wy}" width="8" height="12" fill="${win}"/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>${wins}`;
  }).join("");
};
const door = (extra = "") => `
  <rect width="${W}" height="${H}" fill="#0a0e17"/>
  <rect x="70" y="60" width="220" height="520" rx="4" fill="#3b2a20"/>
  <rect x="92" y="84" width="176" height="200" rx="3" fill="#33241b"/>
  <rect x="92" y="306" width="176" height="250" rx="3" fill="#33241b"/>
  <circle cx="180" cy="160" r="7" fill="#1a120d" stroke="#b08a3e" stroke-width="3"/>
  <rect x="215" y="130" width="50" height="8" rx="2" fill="#b08a3e"/>
  ${[0,1,2,3,4,5].map(i => `<circle cx="${226 + i * 5}" cy="${148 + i * 9}" r="3.4" fill="none" stroke="#8e7034" stroke-width="2"/>`).join("")}
  <rect x="200" y="330" width="62" height="14" rx="7" fill="#c9a24a"/>
  <rect x="246" y="330" width="16" height="60" rx="6" fill="#c9a24a"/>
  <rect x="70" y="580" width="220" height="5" fill="#e8b04a" opacity=".5"/>
  ${extra}`;

const ART = {
  bedroom: () => svg(`
    <rect width="${W}" height="${H}" fill="#0b1220"/>
    <rect x="34" y="70" width="160" height="190" rx="6" fill="#0f1a30" stroke="#1d2a45" stroke-width="8"/>
    <line x1="114" y1="70" x2="114" y2="260" stroke="#1d2a45" stroke-width="6"/>
    ${[[62, 110], [150, 100], [88, 176], [168, 206], [140, 150]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.6" fill="#c9d3ee" opacity=".8"/>`).join("")}
    <rect x="232" y="232" width="96" height="48" rx="8" fill="#05080f" stroke="#1d2a45" stroke-width="3"/>
    <text x="280" y="265" text-anchor="middle" font-family="monospace" font-size="24" fill="#1b2438">--:--</text>
    <rect x="18" y="400" width="324" height="140" rx="16" fill="#152038"/>
    <rect x="34" y="368" width="120" height="56" rx="24" fill="#1e2b48"/>
    <path d="M120 430 q110 -46 222 0 v110 h-222z" fill="#1a2641"/>
    <rect x="180" y="392" width="34" height="58" rx="6" fill="#0a0f18" transform="rotate(-14 197 421)"/>
    <rect x="184" y="397" width="26" height="46" rx="3" fill="#7fb2ff" opacity=".85" transform="rotate(-14 197 421)"/>
    <ellipse cx="197" cy="421" rx="70" ry="44" fill="url(#glow)"/>`,
    `<radialGradient id="glow"><stop offset="0" stop-color="#7fb2ff" stop-opacity=".35"/><stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/></radialGradient>`),

  city: () => svg(`
    <rect width="${W}" height="${H}" fill="#05080f"/>${STARS}
    <circle cx="290" cy="90" r="26" fill="#d9dce8"/><circle cx="302" cy="82" r="24" fill="#05080f"/>
    ${SKYLINE("#0b1120", "#0f1729")}
    <rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#151d2e" stroke-width="26"/>
    <line x1="180" y1="0" x2="180" y2="${H}" stroke="#151d2e" stroke-width="14"/>`),

  radio: () => svg(`
    <rect width="${W}" height="${H}" fill="#0c111c"/>
    <rect x="0" y="470" width="${W}" height="170" fill="#2a1d14"/>
    <line x1="250" y1="290" x2="300" y2="110" stroke="#9aa3b5" stroke-width="5" stroke-linecap="round"/>
    <rect x="50" y="280" width="260" height="190" rx="22" fill="#7a4e2c"/>
    <rect x="66" y="298" width="124" height="154" rx="14" fill="#2b1b10"/>
    ${Array.from({ length: 30 }, (_, i) => `<circle cx="${82 + (i % 5) * 23}" cy="${316 + Math.floor(i / 5) * 23}" r="5" fill="#5a3a22"/>`).join("")}
    <rect x="206" y="300" width="88" height="40" rx="6" fill="#e9d7a8"/>
    <line x1="230" y1="305" x2="230" y2="335" stroke="#d1492f" stroke-width="3"/>
    <circle cx="228" cy="400" r="18" fill="#3b2617"/><circle cx="274" cy="400" r="18" fill="#3b2617"/>
    ${[1,2,3].map(i => `<path d="M${40 - i * 4} ${300 - i * 30} q-${20 + i * 10} ${70 + i * 30} 0 ${140 + i * 60}" stroke="#ffd21f" stroke-width="5" fill="none" opacity="${.9 - i * .25}" stroke-linecap="round"/>`).join("")}`),

  morning: () => svg(`
    <rect width="${W}" height="${H}" fill="#5d6577"/>
    <rect width="${W}" height="${H}" fill="url(#fog)"/>
    ${SKYLINE("#2c3242", "#363d4f")}`,
    `<linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a92a3"/><stop offset="1" stop-color="#3c4354"/></linearGradient>`),

  fridge: () => svg(`

    ${[200, 300, 400].map(y => `<rect x="76" y="${y}" width="208" height="6" fill="#4b566b"/>`).join("")}
    <rect x="96" y="140" width="50" height="60" rx="6" fill="#c9524a"/><rect x="160" y="160" width="70" height="40" rx="20" fill="#e6d6b0"/>
    <rect x="100" y="240" width="40" height="60" rx="4" fill="#dfe6f0"/><rect x="104" y="232" width="32" height="12" rx="3" fill="#3a83d6"/>
    <ellipse cx="200" cy="285" rx="40" ry="16" fill="#8bc34a"/>
    <rect x="96" y="340" width="120" height="60" rx="8" fill="#6d4c3d"/>
    ${[[120,520],[180,540],[240,515]].map(([x, y]) => `<path d="M${x} ${y} q-6 12 0 16 q6 -4 0 -16z" fill="#7fb2ff"/>`).join("")}
    <text x="180" y="490" text-anchor="middle" font-family="Rubik, sans-serif" font-weight="900" font-size="40" fill="#7fb2ff" opacity=".35">+4°C → +12°C</text>`),

  phone: () => svg(`
    <rect width="${W}" height="${H}" fill="#0a0d15"/>
    <rect x="90" y="80" width="180" height="370" rx="28" fill="#05070c" stroke="#262e40" stroke-width="6"/>
    <rect x="104" y="100" width="152" height="330" rx="16" fill="#0d1220"/>
    <rect x="150" y="190" width="56" height="28" rx="5" fill="none" stroke="#ef5a5f" stroke-width="4"/>
    <rect x="206" y="198" width="6" height="12" rx="2" fill="#ef5a5f"/>
    <rect x="155" y="195" width="5" height="18" fill="#ef5a5f"/>
    <text x="180" y="270" text-anchor="middle" font-family="Rubik, sans-serif" font-weight="900" font-size="44" fill="#ef5a5f">4%</text>
    <text x="180" y="310" text-anchor="middle" font-family="Rubik, sans-serif" font-size="16" fill="#8d97b0">Нет сети</text>`),

  peephole: () => svg(`
    <rect width="${W}" height="${H}" fill="#000"/>
    <clipPath id="eye"><circle cx="180" cy="320" r="150"/></clipPath>
    <g clip-path="url(#eye)">
      <rect x="0" y="160" width="${W}" height="320" fill="#2e3d33"/>
      <rect x="20" y="190" width="120" height="50" fill="#3c4d40"/>
      <rect x="110" y="330" width="140" height="180" rx="30" fill="#5a5c55"/>
      <ellipse cx="180" cy="290" rx="66" ry="84" fill="#e9d3b5"/>
      <path d="M114 262 q66 -100 132 0 q-10 -60 -66 -64 q-56 4 -66 64z" fill="#2a221d"/>
      <ellipse cx="156" cy="282" rx="15" ry="13" fill="#fff"/><ellipse cx="204" cy="282" rx="15" ry="13" fill="#fff"/>
      <circle cx="156" cy="283" r="5" fill="#111"/><circle cx="204" cy="283" r="5" fill="#111"/>
      <path d="M140 296 q16 8 32 0 M188 296 q16 8 32 0" stroke="#b7957a" stroke-width="3" fill="none"/>
      <path d="M138 328 q42 34 84 0 q-42 16 -84 0z" fill="#fff" stroke="#3a2b22" stroke-width="3"/>
      <path d="M152 334 v10 M166 337 v12 M180 338 v12 M194 337 v12 M208 334 v10" stroke="#3a2b22" stroke-width="2"/>
      <circle cx="180" cy="320" r="150" fill="url(#vig)"/>
    </g>
    <circle cx="180" cy="320" r="150" fill="none" stroke="#3a3f4a" stroke-width="8"/>`,
    `<radialGradient id="vig"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>`),

  door: () => svg(door()),
  chalk: () => svg(door(`<g stroke="#f1f1ea" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M112 380 h36 l-28 30 q30 -4 30 22 q0 26 -38 22"/>
    <path d="M166 380 v76 M166 380 h20 q18 0 18 18 q0 18 -18 18 h-20"/>
    <path d="M250 456 v-76 h-22 q-16 0 -16 18 q0 18 16 18 h22 M228 416 l-18 40"/></g>`)),

  generator: () => svg(`
    <rect width="${W}" height="${H}" fill="#0b0f18"/>

    <circle cx="74" cy="152" r="6" fill="#ef5a5f"/>

    <rect x="86" y="460" width="90" height="60" rx="6" fill="#1a1f2b"/>
    <circle cx="225" cy="490" r="22" fill="#1a1f2b"/><circle cx="225" cy="490" r="8" fill="#e2b021"/>
    <path d="M200 370 q-40 40 0 70" stroke="#11151f" stroke-width="6" fill="none"/>
    <rect x="270" y="470" width="36" height="16" rx="4" fill="#5d6577"/>
    ${[0,1,2].map(i => `<circle cx="${318 + i * 10}" cy="${450 - i * 30}" r="${10 + i * 6}" fill="#9aa3b5" opacity="${.35 - i * .1}"/>`).join("")}`),

  street: () => svg(`
    <rect width="${W}" height="${H}" fill="#9aa1ae"/>
    ${SKYLINE("#5e6574", "#6a7282")}

    <text x="245" y="460" text-anchor="middle" font-family="Rubik, sans-serif" font-weight="900" font-size="26" fill="#fff">ВОДА</text>
    <rect x="96" y="430" width="70" height="70" rx="8" fill="#e8e9ee"/><rect x="104" y="440" width="40" height="26" rx="3" fill="#2a3346"/>
    ${[120, 200, 300].map(x => `<circle cx="${x}" cy="510" r="18" fill="#1a1d24"/>`).join("")}
    ${Array.from({ length: 9 }, (_, i) => {
      const x = 14 + i * 22, h = 70 + (i % 3) * 8;
      return `<rect x="${x}" y="${600 - h}" width="18" height="${h}" rx="9" fill="#1e2129"/><circle cx="${x + 9}" cy="${590 - h}" r="9" fill="#1e2129"/>`;
    }).join("")}`),

  dawn: () => svg(`
    <rect width="${W}" height="${H}" fill="url(#sun)"/>
    <circle cx="180" cy="430" r="80" fill="#ffcf6b" opacity=".9"/>
    ${SKYLINE("#24203a", "#2c2846")}
    <rect x="0" y="560" width="${W}" height="80" fill="#15131f"/>
    <rect x="264" y="330" width="8" height="240" fill="#0d0c14"/>
    <path d="M268 334 q-30 0 -40 20 h20" stroke="#0d0c14" stroke-width="8" fill="none"/>
    <circle cx="236" cy="362" r="12" fill="#fff4c2"/>
    <circle cx="236" cy="362" r="70" fill="url(#lamp)"/>`,
    `<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f5a"/><stop offset=".55" stop-color="#d8775a"/><stop offset="1" stop-color="#f3b866"/></linearGradient>
     <radialGradient id="lamp"><stop offset="0" stop-color="#fff2b0" stop-opacity=".8"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></radialGradient>`),

  village: () => svg(`
    <rect width="${W}" height="${H}" fill="url(#eve)"/>
    <path d="M0 340 q90 -30 180 -6 q90 24 180 -10 v316 h-360z" fill="#3e5a3a"/>
    <path d="M150 340 l60 0 l150 300 h-360z" fill="#7a6a55"/>
    <path d="M178 360 v20 M182 400 v26 M188 450 v34 M196 510 v44" stroke="#e9e1cc" stroke-width="4"/>
    <rect x="40" y="300" width="50" height="40" fill="#5b3b2a"/><path d="M34 302 l31 -26 l31 26z" fill="#3a2418"/>
    <rect x="58" y="314" width="12" height="12" fill="#ffd27a"/>
    <path d="M300 340 v-30 h28 v30 M296 310 h36" stroke="#4b3426" stroke-width="5" fill="none"/>`,
    `<linearGradient id="eve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f6e"/><stop offset="1" stop-color="#e59a6a"/></linearGradient>`),

  thirst: () => svg(`
    <rect width="${W}" height="${H}" fill="#3a2c22"/>
    ${[[0,380,140,300],[140,300,360,360],[90,520,260,640],[200,430,330,520],[20,600,120,500]].map(([a,b,c,d]) =>
      `<path d="M${a} ${b} L${(a+c)/2+12} ${(b+d)/2-10} L${c} ${d}" stroke="#241912" stroke-width="5" fill="none"/>`).join("")}
    <g transform="rotate(-70 180 360)">
      <rect x="140" y="250" width="80" height="210" rx="26" fill="#cfe2f3" opacity=".55"/>
      <rect x="160" y="226" width="40" height="30" rx="4" fill="#cfe2f3" opacity=".55"/>
      <rect x="158" y="210" width="44" height="20" rx="4" fill="#3a83d6"/>
    </g>`),

  crowd: () => svg(`
    <rect width="${W}" height="${H}" fill="#4a505c"/>
    <rect x="0" y="470" width="${W}" height="170" fill="#2b2f37"/>
    <rect x="170" y="400" width="190" height="80" rx="40" fill="#24467f"/>
    <text x="265" y="450" text-anchor="middle" font-family="Rubik, sans-serif" font-weight="900" font-size="22" fill="#9db6e0">ПУСТО</text>
    ${Array.from({ length: 14 }, (_, i) => {
      const x = (i * 37) % 340, y = 470 + (i % 4) * 30, h = 90;
      return `<rect x="${x}" y="${y}" width="22" height="${h}" rx="11" fill="#14161b" transform="rotate(${(i % 5) * 6 - 12} ${x} ${y})"/><circle cx="${x + 11}" cy="${y - 10}" r="11" fill="#14161b"/>`;
    }).join("")}`),
};

// ---------- story ----------
const START = { water: 1, food: 2, nerve: 3, day: 1, time: "03:47" };
const MAX_PIPS = 5;
const STAT_LABEL = { water: "вода", food: "еда", nerve: "нервы" };

const SCENES = {
  start: { art: "bedroom", lines: ["Ты просыпаешься в *3:47* ночи.", "Электронные часы *погасли*. Холодильник молчит.", "Телефон: *23%*. Сети *нет*."],
    choices: [{ label: "Подойти к окну", to: "window" }] },
  window: { art: "city", lines: ["Весь город *чёрный*.", "Ни фонаря, ни окна. Даже горизонт *не светится*.", "Значит, это не авария *в доме*."],
    choices: [{ label: "Найти радио на батарейках", to: "radio" }, { label: "Лечь спать до утра", to: "morning" }] },
  radio: { art: "radio", lines: ["Сквозь шипение пробивается *один голос*:", "«Энергосистемы отключены *по всей планете*. Причина неизвестна.»", "«Не открывайте холодильник. Набирайте *воду*.»"],
    choices: [{ label: "Пойти на кухню", to: "kitchen", fx: { nerve: 1 } }] },
  morning: { art: "morning", enter: { time: "07:20" }, lines: ["Утро. Света всё ещё *нет*.", "В подъезде кто-то кричит, что вода в кране *заканчивается*."],
    choices: [{ label: "Бежать на кухню", to: "kitchen", fx: { nerve: -1 } }] },
  kitchen: { art: "fridge", lines: ["Закрытый холодильник держит холод около *4 часов*.", "Полная морозилка — до *двух суток*, если её не открывать.", "А вода в кране идёт, пока у насосов есть *давление*."],
    choices: [{ label: "Набрать воду в кастрюли и ванну", to: "day2", fx: { water: 3 } }, { label: "Съесть всё, что испортится", to: "day2", fx: { food: 2 } }] },
  day2: { art: "phone", enter: { day: 2, time: "18:05", water: -1, food: -1 }, lines: ["Второй день. Из крана — только *шипение*.", "Телефон: *4%*."],
    choices: [{ label: "Написать маме: «Я в порядке»", to: "knock", fx: { nerve: 1 } }, { label: "Выключить телефон и беречь заряд", to: "knock" }] },
  knock: { art: "door", enter: { time: "02:13" }, lines: ["Ночь. В дверь стучат. *Три раза*.", "Потом ещё три. *Медленно*."],
    choices: [{ label: "Посмотреть в глазок", to: "peephole" }] },
  peephole: { art: "peephole", lines: ["В глазке — сосед с *девятого* этажа.", "Он *улыбается*. И не моргает.", "«У меня генератор. Пойдём, *погреешься*.»"],
    choices: [{ label: "Открыть дверь", to: "generator" }, { label: "Сделать вид, что тебя нет", to: "chalk", fx: { nerve: -1 } }] },
  generator: { art: "generator", lines: ["У него правда гудит *генератор*.", "На всех каналах одна надпись: *ОСТАВАЙТЕСЬ ДОМА*.", "Он наливает тебе воды. Канистра бензина почти *пустая*."],
    choices: [{ label: "Вернуться к себе до рассвета", to: "day4", fx: { water: 1, nerve: 1 } }] },
  chalk: { art: "chalk", lines: ["Шаги уходят наверх. Потом — *тишина*.", "Утром на твоей двери мелом: *«ЗРЯ»*."],
    choices: [{ label: "Дожить до четвёртого дня", to: "day4" }] },
  day4: { art: "street", enter: { day: 4, time: "09:40", water: -1, food: -1 }, lines: ["Четвёртый день. Люди выходят на *улицы*.", "У школы стоит цистерна *ВОДА*. Очередь — на *два квартала*."],
    choices: [{ label: "Встать в очередь", to: "queue" }, { label: "Уйти пешком к родным в деревню — там колодец", to: "village" }] },
  queue: { resolve: (s) => (s.nerve >= 3 ? "dawn" : "crowd") },

  dawn: { art: "dawn", ending: { n: 1, name: "Первый фонарь", tone: "good" },
    lines: ["Ты стоишь в очереди *четыре часа*. Получаешь *10 литров*.", "На девятый день над улицей загорается *первый фонарь*."] },
  village: { art: "village", ending: { n: 2, name: "Колодец", tone: "good" },
    lines: ["Сорок километров пешком.", "Колодцу не нужно *электричество*.", "Ты выжил. Но город остался *за спиной*."] },
  crowd: { art: "crowd", ending: { n: 3, name: "Давка", tone: "bad" },
    lines: ["К обеду цистерна *пустеет*. Начинается *давка*.", "Ты уходишь ни с чем.", "А дома у двери тебя ждёт сосед с *девятого*."] },
  thirst: { art: "thirst", ending: { n: 4, name: "Сухой кран", tone: "bad" },
    lines: ["Без воды человек живёт около *трёх суток*.", "Набирай воду, пока она *течёт*."] },
};
const ENDINGS_TOTAL = 4;

// ---------- state ----------
const $ = (id) => document.getElementById(id);
const stage = $("stage"), artEl = $("art"), hud = $("hud"), caption = $("caption"),
  choicesEl = $("choices"), card = $("card"), tap = $("tap");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CHUNK_WORDS = 3, CHUNK_MS = 620, LINE_PAUSE_MS = 380;
const FOUND_KEY = "bez-sveta-endings";

// ---------- voice-over (Web Speech API, voices come from the viewer's OS/browser) ----------
const VOICE_KEY = "bez-sveta-voice";
const VOICE_RATE = 1.0, VOICE_PITCH = 0.85;
const PREFERRED_VOICES = ["Milena", "Yuri", "Google русский", "Microsoft Svetlana", "Microsoft Dmitry"];
const SPEECH_GUARD_MS_PER_CHAR = 140, SPEECH_GUARD_EXTRA_MS = 3000;
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voice = null;
let voicePref = (() => { try { return localStorage.getItem(VOICE_KEY) !== "off"; } catch (_) { return true; } })();
const voiceOn = () => Boolean(synth && voice && voicePref);

const ICON_ON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13"/></svg>`;
const ICON_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;

function pickVoice() {
  if (!synth) return;
  const ru = synth.getVoices().filter((v) => /^ru/i.test(v.lang));
  voice = PREFERRED_VOICES.map((n) => ru.find((v) => v.name.includes(n))).find(Boolean) || ru[0] || null;
  renderVoiceBtn();
}
function renderVoiceBtn() {
  const btn = $("voice-btn");
  if (!synth || !voice) {
    btn.disabled = true;
    btn.innerHTML = `${ICON_OFF}Нет русского голоса`;
    btn.title = synth ? "В этом браузере не найден русский голос для озвучки" : "Браузер не поддерживает озвучку";
    btn.setAttribute("aria-pressed", "false");
    return;
  }
  btn.disabled = false;
  btn.title = `Голос: ${voice.name}`;
  btn.innerHTML = `${voicePref ? ICON_ON : ICON_OFF}${voicePref ? "Озвучка вкл" : "Озвучка выкл"}`;
  btn.setAttribute("aria-pressed", String(voicePref));
}
function toggleVoice() {
  voicePref = !voicePref;
  try { localStorage.setItem(VOICE_KEY, voicePref ? "on" : "off"); } catch (_) { /* storage blocked */ }
  if (!voicePref && synth) synth.cancel();
  renderVoiceBtn();
}
function stopSpeech() { if (synth) synth.cancel(); }

let stats = START;
let run = 0;           // increments to cancel an in-flight caption sequence
let skipping = false;
let playing = false;

function readFound() {
  try { return JSON.parse(localStorage.getItem(FOUND_KEY)) || []; } catch (_) { return []; }
}
function saveFound(n) {
  const next = [...new Set([...readFound(), n])];
  try { localStorage.setItem(FOUND_KEY, JSON.stringify(next)); } catch (_) { /* storage blocked */ }
  return next;
}
function renderFound() {
  $("found").textContent = `Концовки: ${readFound().length} из ${ENDINGS_TOTAL}`;
}

const clamp = (v) => Math.max(-1, Math.min(MAX_PIPS, v));
function applyFx(s, fx = {}) {
  return Object.entries(fx).reduce((acc, [k, v]) =>
    (typeof v === "number" && k in STAT_LABEL) ? { ...acc, [k]: clamp(acc[k] + v) } : { ...acc, [k]: v }, s);
}

function fxLabel(fx = {}) {
  return Object.entries(fx).filter(([k]) => k in STAT_LABEL)
    .map(([k, v]) => `${STAT_LABEL[k]} ${v > 0 ? "+" : "−"}${Math.abs(v)}`).join(" · ");
}

// ---------- rendering ----------
function renderHud(prev) {
  const stat = (k) => {
    const v = Math.max(0, stats[k]);
    const pips = Array.from({ length: MAX_PIPS }, (_, i) => `<span class="pip${i < v ? " on" : ""}"></span>`).join("");
    const changed = prev && prev[k] !== stats[k] ? " bump" : "";
    return `<div class="stat${v <= 1 ? " low" : ""}${changed}">${STAT_LABEL[k]}<span class="pips">${pips}</span></div>`;
  };
  hud.innerHTML = `<div class="day">ДЕНЬ ${stats.day}<small>${stats.time}</small></div>
    <div class="stats">${stat("water")}${stat("food")}${stat("nerve")}</div>`;
  hud.hidden = false;
}

function tokenize(line) {
  const out = [];
  line.split(/(\*[^*]+\*)/).filter(Boolean).forEach((part) => {
    const hl = part.startsWith("*");
    part.replace(/\*/g, "").split(/\s+/).filter(Boolean).forEach((w) => out.push({ w, hl }));
  });
  return out;
}
function chunksOf(tokens) {
  const res = [];
  for (let i = 0; i < tokens.length; i += CHUNK_WORDS) res.push(tokens.slice(i, i + CHUNK_WORDS));
  return res;
}
function showChunk(tokens) {
  const span = document.createElement("span");
  span.className = "chunk";
  tokens.forEach((t, i) => {
    const word = document.createElement("span");
    if (t.hl) word.className = "hl";
    word.textContent = t.w;
    span.append(word, i < tokens.length - 1 ? " " : "");
  });
  caption.replaceChildren(span);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function timedLine(line, myRun) {
  const chunks = reduced ? [tokenize(line)] : chunksOf(tokenize(line));
  for (const c of chunks) {
    if (run !== myRun || skipping) return;
    showChunk(c);
    await wait(reduced ? 1600 : CHUNK_MS);
  }
}

// Speaks one line; captions follow word-boundary events, or a timer where the voice sends none.
function spokenLine(line, myRun) {
  return new Promise((resolve) => {
    const tokens = tokenize(line);
    const chunks = reduced ? [tokens] : chunksOf(tokens);
    const text = tokens.map((t) => t.w).join(" ");
    const starts = chunks.reduce((acc, c, i) =>
      [...acc, i === 0 ? 0 : acc[i - 1] + chunks[i - 1].map((t) => t.w).join(" ").length + 1], []);
    let shown = 0, gotBoundary = false, finished = false;
    showChunk(chunks[0]);

    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = voice; utter.lang = voice.lang; utter.rate = VOICE_RATE; utter.pitch = VOICE_PITCH;
    utter.onboundary = (e) => {
      gotBoundary = true;
      if (run !== myRun) return;
      const idx = starts.reduce((best, s, i) => (s <= e.charIndex ? i : best), 0);
      if (idx !== shown) { shown = idx; showChunk(chunks[idx]); }
    };
    const timer = setInterval(() => {
      if (gotBoundary || shown >= chunks.length - 1 || run !== myRun) return;
      shown += 1; showChunk(chunks[shown]);
    }, CHUNK_MS);
    const finish = () => {
      if (finished) return;
      finished = true; clearInterval(timer); clearTimeout(guard); resolve();
    };
    const guard = setTimeout(finish, text.length * SPEECH_GUARD_MS_PER_CHAR + SPEECH_GUARD_EXTRA_MS);
    utter.onend = finish;
    utter.onerror = finish;
    synth.speak(utter);
  });
}

async function playLines(lines, myRun) {
  playing = true; skipping = false; tap.hidden = false;
  for (const line of lines) {
    if (run !== myRun) return false;
    if (skipping) break;
    await (voiceOn() ? spokenLine(line, myRun) : timedLine(line, myRun));
    if (skipping) break;
    await wait(LINE_PAUSE_MS);
  }
  if (run !== myRun) return false;
  showChunk(tokenize(lines[lines.length - 1]));
  playing = false; tap.hidden = true;
  return true;
}

function renderChoices(scene) {
  choicesEl.replaceChildren(...scene.choices.map((c, i) => {
    const b = document.createElement("button");
    b.className = "choice"; b.type = "button"; b.id = `choice-${i}`;
    b.textContent = c.label;
    const fx = fxLabel(c.fx);
    if (fx) { const s = document.createElement("span"); s.className = "fx"; s.textContent = fx; b.append(s); }
    b.addEventListener("click", (e) => { e.stopPropagation(); go(c.to, c.fx); });
    return b;
  }));
  choicesEl.hidden = false;
  choicesEl.querySelector("button")?.focus({ preventScroll: true });
}

function renderEnding(scene) {
  const { n, name, tone } = scene.ending;
  const found = saveFound(n);
  renderFound();
  card.className = `title-card tone-${tone}`;
  card.innerHTML = "";
  const tag = document.createElement("div");
  tag.className = "ending-tag";
  tag.innerHTML = `Концовка ${n} из ${ENDINGS_TOTAL} · <b></b>`;
  tag.querySelector("b").textContent = name;
  const note = document.createElement("p");
  note.textContent = found.length < ENDINGS_TOTAL
    ? `Найдено ${found.length} из ${ENDINGS_TOTAL}. Другие решения ведут к другим концовкам.`
    : "Ты нашёл все концовки.";
  const again = document.createElement("button");
  again.className = "cta"; again.type = "button"; again.id = "again"; again.textContent = "Сыграть ещё";
  again.addEventListener("click", (e) => { e.stopPropagation(); begin(); });
  card.append(tag, note, again);
  card.hidden = false;
  again.focus({ preventScroll: true });
}

async function go(id, fx) {
  const prev = stats;
  stats = applyFx(stats, fx);
  let scene = SCENES[id];
  if (scene.enter) stats = applyFx(stats, scene.enter);
  if (scene.resolve) return go(scene.resolve(stats));
  if (!scene.ending && stats.water < 0) scene = SCENES.thirst;

  const myRun = ++run;
  stopSpeech();
  choicesEl.hidden = true; card.hidden = true;
  artEl.classList.remove("enter"); void artEl.offsetWidth; artEl.classList.add("enter");
  artEl.innerHTML = ART[scene.art]();
  renderHud(prev);
  const done = await playLines(scene.lines, myRun);
  if (!done) return;
  if (scene.ending) renderEnding(scene); else renderChoices(scene);
}

function begin() {
  stats = START;
  go("start");
}

function renderTitle() {
  artEl.innerHTML = ART.city();
  card.className = "title-card";
  card.innerHTML = `<h1>Что если электричество исчезнет <em>по всей планете?</em></h1>
    <p>Четыре дня, три запаса и одна дверь, которую лучше не открывать.</p>
    <button class="cta" type="button" id="start">Начать</button>`;
  $("start").addEventListener("click", (e) => { e.stopPropagation(); begin(); });
  renderFound();
}

function skip() {
  if (!playing) return;
  skipping = true;
  stopSpeech();
}
stage.addEventListener("click", skip);
document.addEventListener("keydown", (e) => {
  if ((e.key === " " || e.key === "Enter") && playing && !(e.target instanceof HTMLButtonElement)) {
    e.preventDefault(); skip();
  }
});
$("voice-btn").addEventListener("click", toggleVoice);
if (synth) {
  pickVoice();
  synth.addEventListener?.("voiceschanged", pickVoice);
} else {
  renderVoiceBtn();
}

renderTitle();
</script>

</body></html>
