<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I love you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,400&display=swap">
<style>
  :root { --bg: #000; --hint: rgba(255, 190, 210, .45); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); text-align: center;
    font: italic 18px "Cormorant Garamond", Georgia, serif; letter-spacing: .25em; color: var(--hint);
    animation: breathe 2.6s ease-in-out infinite; transition: opacity 1.2s; pointer-events: none;
  }
  #hint.gone { opacity: 0; animation: none; }
  @keyframes breathe { 50% { opacity: .35; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap anywhere</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const HEART_POINTS = 420;
  const ASSEMBLE_S = 1.3;
  const LIFE_S = 6.5;
  const FADE_S = 1.4;
  const STAR_COUNT = 140;
  const PALETTE = ['#ff2d6f', '#ff4f8b', '#ff7aa8', '#ffb3c9', '#ff1744', '#ffd1dc'];

  let W = 0, H = 0, DPR = 1;
  const hearts = [];
  const sparks = [];
  let stars = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    stars = Array.from({ length: STAR_COUNT }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + 0.2, p: Math.random() * Math.PI * 2
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  // classic parametric heart, x in [-16,16], y in [-17,12]
  const heartAt = (t) => ({
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
  });
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  const pick = (a) => a[(Math.random() * a.length) | 0];

  function spawnHeart(cx, cy) {
    const size = Math.min(W, H) * (hearts.length ? 0.012 : 0.016);
    const points = Array.from({ length: HEART_POINTS }, (_, i) => {
      const t = (i / HEART_POINTS) * Math.PI * 2;
      const edge = heartAt(t);
      const fill = Math.random() < 0.35 ? Math.sqrt(Math.random()) : 1;
      const angle = Math.random() * Math.PI * 2, dist = Math.random() * Math.max(W, H) * 0.6;
      return {
        tx: edge.x * fill, ty: edge.y * fill,
        sx: cx + Math.cos(angle) * dist, sy: cy + Math.sin(angle) * dist,
        r: Math.random() * 1.8 + 0.6, c: pick(PALETTE), delay: Math.random() * 0.35, tw: Math.random() * 6
      };
    });
    hearts.push({ cx, cy, size, points, age: 0 });
    for (let i = 0; i < 40; i++) burst(cx, cy);
  }

  function burst(x, y) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * 3 + 1;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, r: Math.random() * 2 + 0.5, c: pick(PALETTE), heart: false });
  }

  function floatHeart(x, y) {
    sparks.push({ x, y, vx: (Math.random() - 0.5) * 0.6, vy: -Math.random() * 1.2 - 0.6, life: 1, r: Math.random() * 6 + 5, c: pick(PALETTE), heart: true });
  }

  function drawMiniHeart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    ctx.fill();
  }

  function drawStars(time) {
    for (const s of stars) {
      const a = 0.25 + 0.35 * Math.sin(time * 1.3 + s.p);
      ctx.fillStyle = `rgba(255,220,235,${Math.max(0, a)})`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
  }

  function heartAlpha(h) {
    if (h.age < LIFE_S - FADE_S) return 1;
    return Math.max(0, (LIFE_S - h.age) / FADE_S);
  }

  function drawHeart(h, time) {
    const alpha = heartAlpha(h);
    const beat = reduced ? 1 : 1 + 0.07 * Math.pow(Math.max(0, Math.sin(time * 4.2)), 8) + 0.04 * Math.pow(Math.max(0, Math.sin(time * 4.2 - 0.7)), 8);
    const s = h.size * beat;

    // soft glow behind the heart
    const formed = ease(Math.min(1, h.age / ASSEMBLE_S));
    const glow = ctx.createRadialGradient(h.cx, h.cy - s * 2, 0, h.cx, h.cy - s * 2, s * 26);
    glow.addColorStop(0, `rgba(255,40,100,${0.32 * formed * alpha})`);
    glow.addColorStop(1, 'rgba(255,40,100,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(h.cx - s * 30, h.cy - s * 30, s * 60, s * 60);

    ctx.globalCompositeOperation = 'lighter';
    for (const p of h.points) {
      const k = ease(Math.min(1, Math.max(0, (h.age - p.delay) / ASSEMBLE_S)));
      const x = p.sx + (h.cx + p.tx * s - p.sx) * k;
      const y = p.sy + (h.cy + p.ty * s - p.sy) * k;
      const tw = 0.6 + 0.4 * Math.sin(time * 3 + p.tw);
      ctx.globalAlpha = alpha * tw;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(x, y, p.r * (0.8 + 0.4 * k), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // the words
    const textIn = Math.min(1, Math.max(0, (h.age - ASSEMBLE_S * 0.8) / 1.2));
    if (textIn > 0) {
      const fs = Math.max(34, s * 5.2);
      ctx.save();
      ctx.globalAlpha = textIn * alpha;
      ctx.font = `${fs}px "Great Vibes", "Brush Script MT", cursive`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.shadowColor = '#ff2d6f';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffe3ec';
      ctx.fillText('I love you', h.cx, h.cy + s * 15 + (1 - textIn) * 14);
      ctx.restore();
    }
  }

  function updateSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy;
      if (!p.heart) { p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.02; }
      p.life -= dt * (p.heart ? 0.25 : 0.9);
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.c;
      if (p.heart) drawMiniHeart(p.x, p.y, p.r);
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawStars(time);

    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.age += dt;
      if (h.age > ASSEMBLE_S && Math.random() < dt * 3) floatHeart(h.cx + (Math.random() - 0.5) * h.size * 30, h.cy + h.size * 6);
      if (h.age >= LIFE_S) {
        for (let k = 0; k < 60; k++) burst(h.cx + (Math.random() - 0.5) * h.size * 28, h.cy + (Math.random() - 0.5) * h.size * 24);
        hearts.splice(i, 1);
        continue;
      }
      drawHeart(h, time);
    }
    updateSparks(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('pointerdown', (e) => {
    hint.classList.add('gone');
    spawnHeart(e.clientX, e.clientY);
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') { hint.classList.add('gone'); spawnHeart(W / 2, H / 2); }
  });
})();
</script>
</body>
</html>
